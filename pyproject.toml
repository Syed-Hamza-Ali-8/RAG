[project]
name = "gateway"
version = "0.1.0"
description = "Multi-tenant, permission-aware RAG platform"
authors = [
    { name = "Syed-Hamza-Ali-8", email = "ha5755420@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.156.8",
    "fastembed>=0.9.0",
    "numpy>=2.5.4",
    "openai>=3.35.1",
    "pgvector>=0.5.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["eval"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S608", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
# eval/ modules are imported top-level (pytest pythonpath and script dir).
known-first-party = ["gateway", "metrics", "judge", "run_eval", "verify_golden", "spotcheck", "calibrate_judge"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "pgvector.*", "fastembed.*", "docx.*"]
ignore_missing_imports = true
